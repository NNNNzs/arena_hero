[project]
name = "arenahero-tactic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "arena-hero>=0.2.9,<0.3",
]

[project.optional-dependencies]
test = [
  "pyyaml>=6,<7",
  "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tactic"]

[tool.setuptools.packages.find]
include = ["arena_tactic*"]
exclude = ["runtime*", "tests*"]

[tool.setuptools.package-data]
arena_tactic = ["web/static/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
